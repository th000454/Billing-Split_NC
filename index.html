.help{font-size:11px;color:#819596;line-height:1.65}.divider{height:1px;background:#e9f0eb;margin:17px 0}.checkbox-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.checkbox-card{display:flex;align-items:center;gap:8px;border:1px solid #dfe9e4;border-radius:11px;padding:10px;background:#fafcfa;font-weight:700;font-size:12px;min-height:44px}.checkbox-card:has(input:checked){border-color:#91c7ab;background:#ecf7f0}.checkbox-card input{accent-color:#29876e;width:17px;height:17px}

/* Compact fixed mobile navigation: scrolling categories centered in available width. */
.bottom{justify-content:space-between;gap:3px}
.bottom-main{display:block;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.bottom-main::-webkit-scrollbar{display:none}
.bottom-track{display:flex;align-items:stretch;justify-content:center;gap:2px;min-width:100%;width:max-content;height:100%}

.bottom .tab.settle{margin-left:auto;flex:0 0 82px;align-self:stretch;border-left:1px solid #ecf0ed}
.person-manage-btn{display:grid;place-items:center;width:44px;min-width:44px;height:44px;border:1px solid var(--line);background:#fff;color:#2f7663;border-radius:12px}

.hero-direction{font-size:12px;color:#b6d9cf;font-weight:650;margin:-3px 0 13px;position:relative;z-index:1}
.panel-heading{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:5px}

.panel-hint{color:#879999;font-size:11px;line-height:1.55;margin-bottom:8px}
.settle-icon{color:#4b8d78}
.final-balance{border-top:2px solid #d8e7df;margin-top:4px}
.final-balance .break-number{font-size:18px}
.category-edit{flex-shrink:0;border:1px solid var(--line);background:#fff}

/* v5: align repayment grid controls in equal-size, two-column layout */
.formgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.field,.field>*{min-width:0;max-width:100%}
.field input,.field select,.field textarea{width:100%;min-width:0;max-width:100%;box-sizing:border-box}
#paymentForm .field input,#paymentForm .field select{min-height:48px;height:48px}
#paymentForm .field input[type=date]{-webkit-appearance:none;appearance:none;display:block}
#paymentForm .field input[type=date]::-webkit-date-and-time-value{text-align:left}
#paymentForm .field label{display:block;min-height:18px}

/* Date and amount match the left/right participant cards, including narrow iPhones. */
#recordForm .formgrid,#paymentForm.formgrid{
  grid-template-columns:repeat(2,minmax(0,1fr));
  column-gap:8px;
  row-gap:13px;
}
#recordForm .checkbox-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.field .date-control{
  width:100%;height:48px;min-width:0;max-width:100%;position:relative;
  display:flex;align-items:center;overflow:hidden;
  border:1px solid #dfe9e4;border-radius:11px;
  background:#f9fbfa;
}
.field .date-control .date-display{
  display:block;max-width:100%;padding:0 10px;white-space:nowrap;
  overflow:hidden;text-overflow:clip;color:#1f3c3f;
  font-size:13px;font-weight:450;letter-spacing:-.3px;
  font-variant-numeric:tabular-nums;pointer-events:none;
}
.field .date-control .date-native{
  position:absolute;inset:0;z-index:2;width:100%;height:100%;
  min-width:0;min-height:0;max-width:none;margin:0;padding:0;
  border:0;background:transparent;opacity:0;cursor:pointer;
  -webkit-appearance:none;appearance:none;
}
.field .date-control:focus-within{outline:3px solid #93cbbb;outline-offset:2px}
.field .date-control .date-native::-webkit-calendar-picker-indicator{
  position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;
}


/* iPhone Safari zooms focused form controls when their actual font size is below 16px. */
@media (max-width: 768px) {
  input:not([type="checkbox"]):not([type="radio"]),
  select, textarea { font-size:16px !important; }
}
/* When deleting a category, keep the safer move option above the destructive action. */
.category-move-form { display:flex; flex-direction:column; gap:13px; margin-top:15px; }
.category-move-form .button { width:100%; min-height:44px; }
.category-delete-separator { display:flex; align-items:center; gap:10px; margin:19px 0 12px; color:#93a39e; font-size:11px; }
.category-delete-separator:before,.category-delete-separator:after { content:"";height:1px;flex:1;background:#e9efec; }
.category-delete-warning { color:#a94c46; background:#fff6f4; border:1px solid #f1ddd8; border-radius:11px; padding:11px 12px; font-size:11px; line-height:1.7; }
.category-delete-actions { margin-top:13px; }

function migrateV1(v){
 if(!v||v.schema!==1||!Array.isArray(v.records))return null;
 const d=clone(SEED),byId=new Map(d.records.map(r=>[r.id,r]));
 const paysById=new Map(d.settlements.map(r=>[r.id,r]));
 for(const old of v.records){
  if(!old.id)continue;
  const r=byId.get(old.id),amount=Math.round(num(old.amount));
  if(r){
   r.date=old.date||r.date;r.title=old.title||r.title;
   if(amount>0)r.amount=amount;
   r.receipt=old.receipt||'';r.note=old.note||'';
   r.payer=old.fundSourceId?'cher':old.payer==='Cher'?'cher':'nancy';
   continue;
  }
  const source=v.sheets?.find(sheet=>sheet.id===old.sheetId);
  const paid=(source?.type||'').includes('funds')||String(old.sheetId||'').toLowerCase().includes('advance')||String(old.id).startsWith('red');
  const pid=old.payer==='Cher'?'cher':'nancy';
  if(paid){
   const row={id:old.id,date:old.date||today(),from:pid,to:pid==='nancy'?'cher':'nancy',amount,note:old.title||old.note||'收入'};
   if(paysById.has(row.id))Object.assign(paysById.get(row.id),row);
   else{d.settlements.push(row);paysById.set(row.id,row)}
  }else{
   const row={id:'import_'+old.id,date:old.date||today(),title:old.title||'未命名支出',amount,payer:pid,shares:source?.type==='shared'?['nancy','cher']:source?.type==='cher-expense'?['cher']:['nancy'],category:source?.type==='shared'?'living':'accident',receipt:old.receipt||'',note:old.note||''};
   if(amount>0)d.records.push(row);
  }
 }
 for(const old of v.settlements||[]){
  const from=old.from==='Nancy'?'nancy':'cher',to=from==='nancy'?'cher':'nancy',amount=Math.round(num(old.amount));
  if(amount>0)d.settlements.push({id:old.id||uid('pay'),from,to,date:old.date||today(),amount,note:old.note||''});
 }
 return d;
}
function v3Valid(v){return v&&v.schema===3&&Array.isArray(v.people)&&Array.isArray(v.categories)&&Array.isArray(v.records)&&Array.isArray(v.settlements)}
function migrateV2(v){
 if(!v2Valid(v))return null;
 const d=clone(v),pays=d.records.filter(r=>r.kind==='advance');
 d.schema=3;
 d.categories=d.categories.filter(c=>c.id!=='advance').map(c=>({...c,name:c.id==='living'?'生活支出':c.name,shortName:c.id==='living'?'生活支出':c.shortName}));
 d.records=d.records.filter(r=>r.kind!=='advance').map(r=>{const v={...r};delete v.kind;delete v.method;delete v.fundingId;return v});
 d.settlements=[...d.settlements,...pays.map(r=>({id:r.id,date:r.date,from:r.contributor,to:r.recipient,amount:r.amount,note:r.title||'收入'}))];
 return d;
}
function load(){
 try{
  let raw=localStorage.getItem(STORAGE);
  if(raw){const v=JSON.parse(raw);if(v3Valid(v))return v}
  raw=localStorage.getItem(LEGACY_V2);
  if(raw){const d=migrateV2(JSON.parse(raw));if(d)return d}
  raw=localStorage.getItem(OLD_STORAGE);
  if(raw){const d=migrateV1(JSON.parse(raw));if(d)return d}
 }catch(e){console.warn('讀取資料失敗，改用預設帳本',e)}
 return clone(SEED);
}

function importOriginalBlueNotes(data) {

function compute(){
 // Net positive = receivable. Split arithmetic keeps cents internally, but display is in NT dollars.
 const bs=Object.fromEntries(db.people.map(p=>[p.id,0]));
 const info={expenses:0,accident:0,accidentCher:0,living:0,livingNancyPaid:0,livingNancyShare:0,repayments:0,nancyPayments:0};
 const categories=Object.fromEntries(db.categories.map(c=>[c.id,{total:0,paidByNancy:0,nancyShare:0}]));
 const cAdds=(id,a)=>{if(Object.hasOwn(bs,id))bs[id]+=a};
 for(const r of db.records){
  const amount=cents(Math.round(num(r.amount)));if(amount<=0)continue;
  const splits=[...new Set((r.shares||[]).filter(id=>Object.hasOwn(bs,id)))];
  if(!splits.length||!Object.hasOwn(bs,r.payer))continue;
  const category=cat(r.category);
  info.expenses+=amount;
  if(r.category==='accident'){info.accident+=amount;if(r.payer==='cher')info.accidentCher+=amount}
  if(r.category==='living')info.living+=amount;
  if(!categories[r.category])categories[r.category]={total:0,paidByNancy:0,nancyShare:0};
  categories[r.category].total+=amount;
  if(r.payer==='nancy'){
   categories[r.category].paidByNancy+=amount;
   if(r.category==='living')info.livingNancyPaid+=amount;
  }
  const holder=category?.advanceHolder||'cher';
  const fromAdvance=category?.settlementMode==='advance'&&Object.hasOwn(bs,holder);
  if(!fromAdvance)cAdds(r.payer,amount);
  splits.forEach((id,i)=>{
   const share=Math.floor(amount/splits.length)+(i<amount%splits.length?1:0);
   // Advance-funded category: each sharer's portion goes to the prepaid-fund holder.
   // Actual payer is recorded in the detail, but is not separately credited a second time.
   if(fromAdvance){
    if(id!==holder){cAdds(id,-share);cAdds(holder,share)}
   }else cAdds(id,-share);
   if(id==='nancy'){
    categories[r.category].nancyShare+=share;
    if(r.category==='living')info.livingNancyShare+=share;
   }
  });
 }
 for(const r of db.settlements){
  const amount=cents(Math.round(num(r.amount)));if(amount<=0)continue;
  cAdds(r.from,amount);cAdds(r.to,-amount);
  info.repayments+=amount;
  if(r.from==='nancy')info.nancyPayments+=amount;
 }
 // Show, collect and close out in whole dollars. Close half-dollar residuals after rounding.
 // Quantizing the entire zero-sum ledger together avoids generating a new $1 debt
 // after a payer pays the rounded amount shown on screen.
 const rawBalances=Object.fromEntries(Object.entries(bs).map(([id,value])=>[id,toAmt(value)]));
 const roundSigned=x=>Math.abs(x)<=0.5?0:Math.sign(x)*Math.round(Math.abs(x));
 const displayBalances=Object.fromEntries(Object.entries(rawBalances).map(([id,v])=>[id,roundSigned(v)]));
 let diff=Object.values(displayBalances).reduce((a,b)=>a+b,0),safety=0;
 while(diff!==0&&safety++<db.people.length*2){
  // Correct the member for whom a 1-dollar adjustment most closely matches exact cents.
  const pick=Object.keys(displayBalances).sort((a,b)=>diff>0
   ?(displayBalances[b]-rawBalances[b])-(displayBalances[a]-rawBalances[a])
   :(rawBalances[b]-displayBalances[b])-(rawBalances[a]-displayBalances[a]))[0];
  displayBalances[pick]+=diff>0?-1:1;
  diff+=diff>0?-1:1;
 }
 const creditors=Object.entries(displayBalances).filter(([,v])=>v>0).map(([id,amount])=>({id,amount})).sort((a,b)=>b.amount-a.amount);
 const debtors=Object.entries(displayBalances).filter(([,v])=>v<0).map(([id,amount])=>({id,amount:-amount})).sort((a,b)=>b.amount-a.amount);
 const transfers=[];let i=0,j=0;
 while(i<debtors.length&&j<creditors.length){
  const amt=Math.min(debtors[i].amount,creditors[j].amount);
  if(amt>0)transfers.push({from:debtors[i].id,to:creditors[j].id,amount:amt});
  debtors[i].amount-=amt;creditors[j].amount-=amt;
  if(debtors[i].amount===0)i++;
  if(creditors[j].amount===0)j++;
 }
 return {
  balances:displayBalances,
  rawBalances,
  transfers,
  info:Object.fromEntries(Object.entries(info).map(([key,value])=>[key,toAmt(value)])),
  categories:Object.fromEntries(Object.entries(categories).map(([id,v])=>[id,Object.fromEntries(Object.entries(v).map(([key,value])=>[key,toAmt(value)]))]))
 };
}

  });
} catch(e) {
  console.error("Firebase 初始化失敗", e);
}
</script>
